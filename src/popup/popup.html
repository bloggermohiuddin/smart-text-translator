<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Text Translator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
      </div>
      <div>
        <h1>Smart Text Translator</h1>
        <p id="statusLine" class="status">Loading…</p>
      </div>
    </header>

    <main>
      <label class="toggle-row">
        <span class="toggle-text">
          <strong>Extension enabled</strong>
          <small>Turn all selection translation on or off</small>
        </span>
        <span class="switch">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="toggle-row">
        <span class="toggle-text">
          <strong>Translate on selection</strong>
          <small>Show the popup when you select text</small>
        </span>
        <span class="switch">
          <input type="checkbox" id="selectionToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <div class="field">
        <label for="modeSelect">Translation mode</label>
        <select id="modeSelect">
          <option value="instant">Instant translation</option>
          <option value="ask">Ask before translating</option>
        </select>
      </div>

      <div class="field">
        <label for="targetSelect">Translate into</label>
        <select id="targetSelect"></select>
      </div>
    </main>

    <footer class="popup-footer">
      <button id="openSettings" class="btn primary" type="button">Settings</button>
      <button id="openHistory" class="btn ghost" type="button">History</button>
    </footer>
  </div>
  <script src="../shared/constants.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
